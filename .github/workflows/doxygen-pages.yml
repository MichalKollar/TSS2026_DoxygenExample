name: Build & Publish Doxygen to Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install doxygen & graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Build docs (Doxygen)
        working-directory: ./docs
        shell: bash
        run: |
          # Use the system Graphviz instead of the portable Windows copy.
          { cat Doxyfile; printf '\nDOT_PATH =\n'; } | doxygen -
          test -s out/html/index.html
          test -n "$(find out/html -name '*inherit__graph.svg' -size +0c -print -quit)"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/out/html

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
